<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle del negocio | Findex</title>
  <meta name="description" content="Detalles del negocio, horarios, ubicación y contacto." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .detail-wrap{
      width:min(1120px, calc(100% - 32px));
      margin:0 auto;
      padding:34px 0 44px;
    }

    .back-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      color:#2ee59d;
      margin-bottom:20px;
      font-weight:800;
    }

    .detail-grid{
      display:grid;
      grid-template-columns:1.05fr 0.95fr;
      gap:22px;
      align-items:start;
    }

    .detail-media-stack{
      display:grid;
      gap:12px;
    }

    .detail-media{
      position:relative;
      border-radius:28px;
      overflow:hidden;
      min-height:520px;
      border:1px solid rgba(255,255,255,0.08);
      box-shadow:0 24px 80px rgba(0,0,0,0.45);
      background:rgba(255,255,255,0.03);
    }

    .detail-media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .detail-badge{
      position:absolute;
      top:18px;
      left:18px;
      padding:9px 12px;
      border-radius:999px;
      background:rgba(46,229,157,0.94);
      color:#04120c;
      font-weight:800;
      font-size:0.82rem;
    }

    .detail-card{
      padding:24px;
      border-radius:28px;
      background:rgba(15,23,42,0.92);
      border:1px solid rgba(148,163,184,0.16);
      box-shadow:0 24px 80px rgba(0,0,0,0.3);
    }

    .detail-title{
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
      margin-bottom:14px;
    }

    .detail-title h1{
      font-size:2.2rem;
      margin-bottom:8px;
      line-height:1;
      letter-spacing:0;
    }

    .detail-title p{
      color:#94a3b8;
    }

    .detail-rating{
      color:#f9c74f;
      font-weight:800;
      white-space:nowrap;
    }

    .detail-meta{
      display:grid;
      gap:12px;
      margin:18px 0;
      color:#cbd5e1;
    }

    .detail-meta .row{
      display:flex;
      gap:10px;
      align-items:center;
      padding:12px 14px;
      border-radius:16px;
      background:rgba(255,255,255,0.035);
      border:1px solid rgba(255,255,255,0.06);
      line-height:1.5;
    }

    .detail-actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:22px;
    }

    .detail-description{
      margin-top:18px;
      color:#cbd5e1;
      line-height:1.8;
    }

    .gallery{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    .gallery button{
      border:none;
      padding:0;
      overflow:hidden;
      height:96px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.03);
      cursor:pointer;
    }

    .gallery button.active{
      border-color:rgba(46,229,157,0.55);
      box-shadow:0 0 0 3px rgba(46,229,157,0.12);
    }

    .gallery img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    @media (max-width: 900px){
      .detail-grid{
        grid-template-columns:1fr;
      }

      .detail-media{
        min-height:340px;
      }
    }

    @media (max-width: 560px){
      .detail-title{
        flex-direction:column;
      }

      .gallery{
        grid-template-columns:repeat(2,1fr);
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Findex">
      <div class="brand-mark">F</div>
      <span class="brand-name">FINDEX</span>
    </a>

    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="index.html#explorar">Explorar</a>
      <a href="index.html#categorias">Categorías</a>
      <a href="index.html#empresas">Empresas</a>
    </nav>

    <div class="nav-actions" id="navActions"></div>
  </header>

  <main class="detail-wrap">
    <a class="back-link" href="index.html#explorar">← Volver al directorio</a>
    <div id="detailRoot"></div>
  </main>

  <script src="data.js"></script>
  <script>
    const detailRoot = document.getElementById("detailRoot");
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));
    const selected = getBusinesses().find(b => Number(b.id) === id);

    if (!selected) {
      detailRoot.innerHTML = `
        <div class="empty-state">
          No se encontró el negocio solicitado. Vuelve al directorio e inténtalo de nuevo.
        </div>
      `;
    } else {
      const gallery = getBusinessGallery(selected);
      const mainImage = gallery[0] || getBusinessMainImage(selected);
      const whatsappText = encodeURIComponent(`Hola, vi tu negocio en Findex y quiero más información sobre ${selected.nombre}.`);
      const websiteButton = selected.sitio
        ? `<a class="btn btn-ghost" href="${escapeHTML(selected.sitio)}" target="_blank" rel="noopener">Visitar sitio web</a>`
        : "";

      detailRoot.innerHTML = `
        <section class="detail-grid">
          <div class="detail-media-stack">
            <div class="detail-media">
              <img id="mainDetailImage" src="${escapeHTML(mainImage)}" alt="${escapeHTML(selected.nombre)}" />
              ${selected.destacado ? '<div class="detail-badge">Destacado</div>' : ""}
            </div>

            ${gallery.length > 1 ? `
              <div class="gallery" id="detailGallery">
                ${gallery.map((image, index) => `
                  <button class="${index === 0 ? "active" : ""}" type="button" data-image="${escapeHTML(image)}" aria-label="Ver foto ${index + 1}">
                    <img src="${escapeHTML(image)}" alt="${escapeHTML(selected.nombre)} ${index + 1}" />
                  </button>
                `).join("")}
              </div>
            ` : ""}
          </div>

          <div class="detail-card">
            <div class="detail-title">
              <div>
                <h1>${escapeHTML(selected.nombre)}</h1>
                <p>${escapeHTML(selected.categoriaLabel)}</p>
              </div>
              <div class="detail-rating">★ ${Number(selected.rating || 0).toFixed(1)} (${selected.reseñas || 0})</div>
            </div>

            <div class="detail-meta">
              <div class="row">📍 <strong>Ubicación:</strong> ${escapeHTML(selected.ubicacion)}</div>
              <div class="row">🕒 <strong>Horario:</strong> ${escapeHTML(selected.horario || "Horario no disponible")}</div>
              <div class="row">☎ <strong>Teléfono:</strong> ${escapeHTML(selected.telefono || "No disponible")}</div>
              <div class="row">${selected.verificado ? "Verificado por Findex" : "Perfil pendiente de verificación"}</div>
            </div>

            <div class="detail-description">
              ${escapeHTML(selected.descripcion)}
            </div>

            <div class="detail-actions">
              <a class="btn btn-primary" href="https://wa.me/${escapeHTML(selected.whatsapp)}?text=${whatsappText}" target="_blank" rel="noopener">Contactar por WhatsApp</a>
              ${websiteButton}
            </div>
          </div>
        </section>
      `;

      const mainDetailImage = document.getElementById("mainDetailImage");
      document.querySelectorAll("#detailGallery button").forEach(button => {
        button.addEventListener("click", () => {
          mainDetailImage.src = button.dataset.image;
          document.querySelectorAll("#detailGallery button").forEach(item => item.classList.remove("active"));
          button.classList.add("active");
        });
      });
    }
  </script>
  <script>
    renderSessionNav("navActions");
  </script>
</body>
</html>
