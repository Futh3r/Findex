<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planes para empresas | Findex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .plans-wrap{
      width:min(1180px, calc(100% - 32px));
      margin:0 auto;
      padding:38px 0 48px;
    }

    .plans-head{
      margin-bottom:20px;
    }

    .plans-head h1{
      font-size:clamp(2rem, 4vw, 3rem);
      margin-bottom:10px;
      letter-spacing:0;
    }

    .plans-head p{
      color:#94a3b8;
      line-height:1.8;
      max-width:62ch;
    }

    .plans-note{
      margin-top:18px;
      padding:14px 16px;
      border-radius:18px;
      background:rgba(46,229,157,0.08);
      border:1px solid rgba(46,229,157,0.18);
      color:#cbd5e1;
      line-height:1.7;
    }

    .plans-note strong{
      color:#2ee59d;
    }

    .plans-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:18px;
      margin-top:24px;
    }

    .plan-card{
      border-radius:28px;
      border:1px solid rgba(148,163,184,0.16);
      background:rgba(15,23,42,0.9);
      padding:24px;
      box-shadow:0 24px 80px rgba(0,0,0,0.28);
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    .plan-card.featured{
      border-color:rgba(46,229,157,0.34);
      box-shadow:0 24px 80px rgba(46,229,157,0.08);
      transform:translateY(-4px);
    }

    .plan-card.current{
      border-color:rgba(56,189,248,0.38);
      background:rgba(15,23,42,0.98);
    }

    .plan-top{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .plan-top h2{
      font-size:1.4rem;
      margin-bottom:6px;
    }

    .plan-price{
      color:#2ee59d;
      font-weight:800;
    }

    .plan-desc{
      color:#94a3b8;
      line-height:1.7;
    }

    .plan-list{
      display:grid;
      gap:10px;
      color:#cbd5e1;
    }

    .plan-list span{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(255,255,255,0.035);
      border:1px solid rgba(255,255,255,0.06);
    }

    .plan-card .btn{
      margin-top:auto;
    }

    @media (max-width: 900px){
      .plans-grid{
        grid-template-columns:1fr;
      }

      .plan-card.featured{
        transform:none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Findex">
      <div class="brand-mark">F</div>
      <span class="brand-name">FINDEX</span>
    </a>

    <nav class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="index.html#explorar">Explorar</a>
      <a href="index.html#categorias">Categorías</a>
      <a href="index.html#empresas">Empresas</a>
    </nav>

    <div class="nav-actions" id="navActions"></div>
  </header>

  <main class="plans-wrap">
    <section class="plans-head">
      <div class="eyebrow">Planes para empresas</div>
      <h1>Selecciona el nivel que mejor se adapta a tu negocio</h1>
      <p>
        Puedes revisar los planes aunque estés usando una cuenta de cliente. Si eliges uno,
        Findex convierte tu cuenta en empresa y abre tu panel para publicar negocios.
      </p>
      <div class="plans-note" id="plansNote"></div>
    </section>

    <div class="plans-grid" id="plansGrid"></div>
  </main>

  <script src="data.js"></script>
  <script>
    const currentUser = getCurrentUser();
    const plansGrid = document.getElementById("plansGrid");
    const plansNote = document.getElementById("plansNote");

    function getPlansNote() {
      if (!currentUser) {
        return "<strong>Sin sesión:</strong> puedes ver los planes y crear una cuenta de empresa al elegir uno.";
      }

      if (isClientUser(currentUser)) {
        return "<strong>Cuenta de cliente activa:</strong> elegir un plan transformará tu cuenta en empresa sin perder tu sesión.";
      }

      return `<strong>Cuenta de empresa activa:</strong> estás viendo opciones para tu plan actual.`;
    }

    function getPlanButtonLabel(plan, isCurrent) {
      if (isCurrent) return "Seleccionado";
      if (!currentUser) return `Crear empresa con ${plan.label}`;
      if (isClientUser(currentUser)) return `Convertirme con ${plan.label}`;
      return `Elegir ${plan.label}`;
    }

    plansNote.innerHTML = getPlansNote();

    plansGrid.innerHTML = planDefinitions.map(plan => {
      const isCurrent = currentUser?.plan === plan.key;

      return `
        <article class="plan-card ${plan.key === "premium" ? "featured" : ""} ${isCurrent ? "current" : ""}">
          <div class="plan-top">
            <div>
              <h2>${plan.label}</h2>
              <div class="plan-price">${plan.price}</div>
            </div>
            ${isCurrent ? '<span class="pill">Plan actual</span>' : plan.key === "premium" ? '<span class="pill">Más recomendado</span>' : ""}
          </div>

          <p class="plan-desc">${plan.description}</p>

          <div class="plan-list">
            <span>✓ ${plan.maxBusinesses === 10 ? "Hasta 10 negocios" : `Hasta ${plan.maxBusinesses} negocio${plan.maxBusinesses === 1 ? "" : "s"}`}</span>
            <span>✓ ${plan.extraFields ? "Más personalización visual" : "Perfil esencial para empezar"}</span>
            <span>✓ ${plan.featured ? "Aparece en destacados" : "Sin destacados automáticos"}</span>
          </div>

          <button class="btn btn-primary" type="button" onclick="choosePlan('${plan.key}')" ${isCurrent ? "disabled" : ""}>
            ${getPlanButtonLabel(plan, isCurrent)}
          </button>
        </article>
      `;
    }).join("");

    function choosePlan(planKey) {
      const user = getCurrentUser();

      if (!user) {
        window.location.href = `auth.html?tipo=empresa&plan=${encodeURIComponent(planKey)}`;
        return;
      }

      setUserPlan(planKey);
      const updated = getCurrentUser();
      window.location.href = isAdmin(updated) ? "admin.html" : "dashboard.html";
    }
  </script>
  <script>
    renderSessionNav("navActions");
  </script>
</body>
</html>
